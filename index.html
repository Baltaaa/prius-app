<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/prius-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F7F2" />
    <!-- Tema (claro/oscuro) antes del primer pintado: archivo propio y no
         inline porque la CSP de producción no admite scripts inline. -->
    <script src="/tema-inicial.js"></script>
    <meta name="description" content="Prius App - Panel de gestión balnearia." />

    <!-- Instalable como app (nov 2026, Tarea 6). El manifest lo genera
         vite-plugin-pwa; el service worker (src/sw.js) precachea SOLO el
         shell y nunca toca Supabase: la app vive de datos en tiempo real,
         servir una caja vieja de caché sería peor que un error de red. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: el contenido llega hasta arriba de todo y las
         safe areas (viewport-fit=cover) se encargan del notch. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prius" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Pantallas de arranque de iOS, generadas del logo real del repo con
         scripts/generar-iconos-pwa.mjs (nunca un placeholder). -->
    <link rel="apple-touch-startup-image" href="/icons/splash/iphone-15.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/iphone-15-pro-max.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/iphone-13.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/iphone-12-pro-max.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/iphone-x.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/iphone-8-plus.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash/iphone-8.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- Tipografía self-hosted vía @fontsource-variable (oct 2026, Bloque 2)
         — importada en src/main.jsx, nunca más Google Fonts CDN acá. -->
    <title>Prius App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
