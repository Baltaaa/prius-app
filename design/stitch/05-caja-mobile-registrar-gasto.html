  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-container"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin-mobile flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Volver" class="w-11 h-11 -ml-space-xs flex items-center justify-center text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Nueva Reserva</h1></div><div class="flex items-center gap-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-14 pb-10 px-margin-mobile bg-surface"><div class="flex flex-col w-full relative -mx-margin-mobile px-margin-mobile">

<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Caja Diaria</p>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Octubre 2026</h2>
</div>
<div class="flex items-center gap-space-xs bg-surface-container-high px-space-sm py-1 rounded-full">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-label-md text-label-md text-on-surface">Turno Tarde</span>
</div>
</div>
<!-- KPI Cards de fondo -->
<div class="grid grid-cols-2 gap-gutter-sm">
<div class="bg-surface-container-lowest p-space-md rounded-xl flex flex-col gap-space-xs">
<span class="font-label-md text-label-md text-on-surface-variant">INGRESOS HOY</span>
<span class="font-headline-sm text-headline-sm text-on-surface">$ 485.200</span>
</div>
<div class="bg-surface-container-lowest p-space-md rounded-xl flex flex-col gap-space-xs">
<span class="font-label-md text-label-md text-on-surface-variant">EGRESOS HOY</span>
<span class="font-headline-sm text-headline-sm text-error">$ 42.500</span>
</div>
</div>
<!-- Lista simulada de movimientos de fondo -->
<div class="bg-surface-container-lowest rounded-xl p-space-md flex flex-col gap-space-sm">
<div class="flex justify-between items-center py-space-xs">
<div class="flex items-center gap-space-sm">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-[18px] text-on-surface">beach_access</span>
</div>
<div>
<p class="font-title-md text-title-md text-on-surface">Carpa #14 - Familia Rossi</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Alquiler Día Completo</p>
</div>
</div>
<span class="font-title-md text-title-md text-tertiary">+$ 35.000</span>
</div>
</div>
</div>
<!-- Scrim / Backdrop Oscurecido de Alta Fidelidad -->
<div class="fixed inset-0 bg-[#000000]/60 z-40 transition-opacity backdrop-blur-[2px]"></div>

<div class="fixed inset-x-0 bottom-0 z-50 flex flex-col justify-end max-w-lg mx-auto">

<div class="w-full flex justify-center pb-3">
<div class="w-10 h-1 rounded-full bg-secondary-fixed-dim"></div>
</div>
<!-- Cabecera del Bottom Sheet -->
<div class="flex items-center justify-between pb-4">

</div>
<button aria-label="Cerrar modal" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-variant active:scale-95 transition-all" type="button">

</button>
</div>
<!-- Formulario de Registro de Egreso -->
<form class="flex flex-col gap-space-lg pt-1" onsubmit="event.preventDefault();">
<!-- 1. CONCEPTO -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface tracking-wide" for="gasto-concepto">
              CONCEPTO <span class="text-error">*</span>
</label>
<span class="font-body-sm text-body-sm text-secondary" id="char-counter">0/120</span>
</div>
<div class="relative w-full">
<input class="w-full h-12 px-4 rounded-xl bg-surface text-on-surface placeholder:text-secondary font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none transition-all" id="gasto-concepto" maxlength="120" oninput="document.getElementById('char-counter').innerText = `${this.value.length}/120`" placeholder="Ej. Compra de hielo para chiringuito" type="text"/>
</div>
</div>
<!-- 2. CATEGORÍA -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface tracking-wide">
            CATEGORÍA <span class="text-error">*</span>
</label>
<div class="flex flex-wrap gap-1.5" id="category-selector">
<button class="cat-pill px-3 py-2 rounded-xl text-body-sm font-title-md bg-surface text-secondary transition-all" onclick="selectCategory(this)" type="button">
              Proveedores
            </button>
<button class="cat-pill px-3 py-2 rounded-xl text-body-sm font-title-md bg-surface text-secondary transition-all" onclick="selectCategory(this)" type="button">
              Sueldos / Adelantos
            </button>
<button class="cat-pill px-3 py-2 rounded-xl text-body-sm font-title-md bg-surface text-secondary transition-all" onclick="selectCategory(this)" type="button">
              Mantenimiento
            </button>
<button class="cat-pill px-3 py-2 rounded-xl text-body-sm font-title-md bg-surface text-secondary transition-all" onclick="selectCategory(this)" type="button">
              Limpieza
            </button>
<button class="cat-pill px-3 py-2 rounded-xl text-body-sm font-title-md bg-primary-container text-on-primary-container font-headline-sm transition-all" onclick="selectCategory(this)" type="button">
              Insumos
            </button>
<button class="cat-pill px-3 py-2 rounded-xl text-body-sm font-title-md bg-surface text-secondary transition-all" onclick="selectCategory(this)" type="button">
              Servicios
            </button>
<button class="cat-pill px-3 py-2 rounded-xl text-body-sm font-title-md bg-surface text-secondary transition-all" onclick="selectCategory(this)" type="button">
              Retiro del dueño
            </button>
<button class="cat-pill px-3 py-2 rounded-xl text-body-sm font-title-md bg-surface text-secondary transition-all" onclick="selectCategory(this)" type="button">
              Otros
            </button>
</div>
</div>
<!-- 3. MONTO -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface tracking-wide" for="gasto-monto">
            MONTO <span class="text-error">*</span>
</label>
<div class="relative flex items-center bg-surface rounded-xl px-4 h-14 focus-within:bg-surface-container-lowest transition-all">
<span class="font-headline-md text-headline-md text-on-surface pr-2 select-none">$</span>
<input class="w-full bg-transparent font-metric-xl text-metric-xl text-on-surface focus:outline-none tracking-tight" id="gasto-monto" inputmode="decimal" type="text" value="15.000"/>
<span class="font-label-md text-label-md uppercase px-2 py-1 rounded bg-surface-container-high text-on-surface-variant">ARS</span>
</div>
</div>
<!-- 4. MEDIO DE PAGO -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface tracking-wide">
            MEDIO DE PAGO <span class="text-error">*</span>
</label>
<div class="flex flex-wrap gap-2" id="payment-method-selector">
<button class="pay-pill px-3.5 py-2.5 rounded-xl font-label-lg text-label-lg bg-inverse-surface text-inverse-on-surface flex items-center gap-1.5 transition-all" onclick="selectPayment(this)" type="button">
<span class="material-symbols-outlined text-[16px] text-primary-container">payments</span>
<span>Efectivo</span>
</button>
<button class="pay-pill px-3.5 py-2.5 rounded-xl font-label-lg text-label-lg bg-surface text-secondary flex items-center gap-1.5 transition-all" onclick="selectPayment(this)" type="button">
<span class="material-symbols-outlined text-[16px]">account_balance</span>
<span>Transferencia</span>
</button>
<button class="pay-pill px-3.5 py-2.5 rounded-xl font-label-lg text-label-lg bg-surface text-secondary flex items-center gap-1.5 transition-all" onclick="selectPayment(this)" type="button">
<span class="material-symbols-outlined text-[16px]">qr_code_2</span>
<span>Mercado Pago</span>
</button>
<button class="pay-pill px-3.5 py-2.5 rounded-xl font-label-lg text-label-lg bg-surface text-secondary flex items-center gap-1.5 transition-all" onclick="selectPayment(this)" type="button">
<span class="material-symbols-outlined text-[16px]">credit_card</span>
<span>Tarjeta Débito</span>
</button>
<button class="pay-pill px-3.5 py-2.5 rounded-xl font-label-lg text-label-lg bg-surface text-secondary flex items-center gap-1.5 transition-all" onclick="selectPayment(this)" type="button">
<span class="material-symbols-outlined text-[16px]">credit_card_heart</span>
<span>Tarjeta Crédito</span>
</button>
</div>
</div>
<!-- 5. CAMPOS OPCIONALES (PROVEEDOR Y COMPROBANTE) -->
<div class="grid grid-cols-2 gap-gutter-sm">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary tracking-wide uppercase truncate" for="gasto-proveedor">
              Proveedor (Opc.)
            </label>
<div class="relative">
<input class="w-full h-11 px-3 rounded-xl bg-surface text-on-surface placeholder:text-secondary font-body-sm text-body-sm focus:bg-surface-container-lowest focus:outline-none transition-all" id="gasto-proveedor" placeholder="Ej. Rolito MDP" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary tracking-wide uppercase truncate" for="gasto-comprobante">
              Ticket / Factura (Opc.)
            </label>
<div class="relative">
<input class="w-full h-11 px-3 rounded-xl bg-surface text-on-surface placeholder:text-secondary font-body-sm text-body-sm focus:bg-surface-container-lowest focus:outline-none transition-all" id="gasto-comprobante" placeholder="Ej. Tkt #4829" type="text"/>
</div>
</div>
</div>
<!-- Indicador de auditoría de caja -->
<div class="flex items-center gap-space-xs bg-surface-container-low px-3 py-2 rounded-xl">
<span class="material-symbols-outlined text-[18px] text-primary">verified_user</span>

<button class="w-full h-12 bg-primary-container text-on-primary-container active:scale-[0.99] font-headline-sm text-headline-sm rounded-xl flex items-center justify-center gap-space-xs transition-transform" id="btn-submit" type="submit">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
<span>REGISTRAR GASTO</span>
</button>
</div>
</form>
</div>
</div>
</div>
<script>
  function selectCategory(el) {
    const pills = document.querySelectorAll('.cat-pill');
    pills.forEach(p => {
      p.className = 'cat-pill px-3 py-2 rounded-xl text-body-sm font-title-md bg-surface text-secondary transition-all';
    });
    el.className = 'cat-pill px-3 py-2 rounded-xl text-body-sm font-title-md bg-primary-container text-on-primary-container font-headline-sm transition-all';
  }

  function selectPayment(el) {
    const pills = document.querySelectorAll('.pay-pill');
    pills.forEach(p => {
      p.className = 'pay-pill px-3.5 py-2.5 rounded-xl font-label-lg text-label-lg bg-surface text-secondary flex items-center gap-1.5 transition-all';
      const icon = p.querySelector('.material-symbols-outlined');
      if (icon) icon.classList.remove('text-primary-container');
    });
    el.className = 'pay-pill px-3.5 py-2.5 rounded-xl font-label-lg text-label-lg bg-inverse-surface text-inverse-on-surface flex items-center gap-1.5 transition-all';
    const icon = el.querySelector('.material-symbols-outlined');
    if (icon) icon.classList.add('text-primary-container');
  }

  // Micro-interacción de confirmación rápida
  document.getElementById('btn-submit')?.addEventListener('click', function() {
    this.classList.add('scale-95');
    setTimeout(() => {
      this.classList.remove('scale-95');
      this.innerHTML = '<span class="material-symbols-outlined text-[20px]">done_all</span><span>¡GASTO ASENTADO!</span>';
      this.classList.replace('bg-primary-container', 'bg-tertiary-container');
      this.classList.replace('text-on-primary-container', 'text-on-tertiary-container');
    }, 200);
  });
</script></main></body></html>
